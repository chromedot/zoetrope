<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story Slideshow</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: #fff;
            font-family: sans-serif;
        }
        #slide-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        #slide-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }
        #slide-image.active {
            opacity: 1;
        }
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.5);
            color: white;
            border: none;
            padding: 2rem 1rem;
            cursor: pointer;
            font-size: 2rem;
            z-index: 10;
        }
        .nav-btn:hover { background: rgba(255,255,255,0.2); }
        #prev { left: 0; }
        #next { right: 0; }
        
        #exit-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.5);
            border: 1px solid #fff;
            color: #fff;
            padding: 5px 10px;
            cursor: pointer;
            z-index: 10;
        }
        
        #caption {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            text-shadow: 1px 1px 2px black;
            font-size: 1.2rem;
            background: rgba(0,0,0,0.4);
            padding: 10px;
        }
    </style>
</head>
<body>

<div id="slide-container">
    <button id="exit-btn" onclick="window.location.href='/gallery'">Exit Slideshow</button>
    <button class="nav-btn" id="prev" onclick="changeSlide(-1)">&#10094;</button>
    
    <img id="slide-image" src="" alt="Slide">
    <div id="caption"></div>
    
    <button class="nav-btn" id="next" onclick="changeSlide(1)">&#10095;</button>
</div>

<script>
    const scenes = {{ scenes | tojson }};
    let currentIndex = 0;
    let timer = null;

    function showSlide(index) {
        if (index < 0) index = scenes.length - 1;
        if (index >= scenes.length) index = 0;
        
        currentIndex = index;
        
        const img = document.getElementById('slide-image');
        const caption = document.getElementById('caption');
        
        // Fade out
        img.classList.remove('active');
        
        setTimeout(() => {
            const scene = scenes[currentIndex];
            img.src = "/images/" + scene.image_path;
            caption.innerText = scene.description;
            
            // Fade in
            img.onload = () => img.classList.add('active');
        }, 500); // Wait for fade out
    }

    function changeSlide(direction) {
        resetTimer();
        showSlide(currentIndex + direction);
    }

    function resetTimer() {
        if (timer) clearInterval(timer);
        timer = setInterval(() => changeSlide(1), 5000);
    }

    // Initial load
    showSlide(0);
    resetTimer();

    // Keyboard navigation
    document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') changeSlide(-1);
        if (e.key === 'ArrowRight') changeSlide(1);
        if (e.key === 'Escape') window.location.href='/gallery';
    });
</script>

</body>
</html>
