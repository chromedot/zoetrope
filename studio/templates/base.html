<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoetrope</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #bb86fc;
            --secondary-color: #03dac6;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #2c2c2c;
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 { margin: 0; font-size: 1.5rem; }
        nav a {
            color: var(--text-color);
            text-decoration: none;
            margin-left: 1rem;
            font-weight: bold;
        }
        nav a:hover { color: var(--accent-color); }
        .container {
            padding: 2rem;
            max-width: 1600px;
            margin: 0 auto;
        }
        button {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 0.5rem 1rem;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover { background-color: #9965f4; }
        button:disabled { background-color: #555; cursor: not-allowed; }
        .btn-secondary { background-color: var(--secondary-color); }
        .btn-secondary:hover { background-color: #018786; }
    </style>
    {% block head %}{% endblock %}
</head>
<body>
    <header>
        <h1>Zoetrope</h1>
        <nav>
            <a href="/dashboard" style="color: var(--accent-color);">Dashboard</a>
            <a href="/gallery">Gallery</a>
            <a href="/videos">Videos</a>
            <a href="/slideshow" style="color: var(--secondary-color);">Slideshow</a>
            <a href="/status">Status</a>
        </nav>
    </header>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    {% block scripts %}{% endblock %}
</body>
</html>
